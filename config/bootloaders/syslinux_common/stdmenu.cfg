# brand amber #ffb13d with Arc-Dark's #2f343f on it, hints in Arc's title-bar
# icon gray #90939b.
menu color title	* #00000000 *
menu color border	* #00000000 #00000000 none
menu color unsel	* #ffd3dae3 #00000000 none
menu color sel		* #ff2f343f #ffffb13d none
menu color hotkey	* #ffffb13d #00000000 none
menu color hotsel	* #ff2f343f #ffffb13d none
menu color tabmsg	* #ff90939b #00000000 none
menu color timeout_msg	* #ff90939b #00000000 none
menu color timeout	* #ffd3dae3 #00000000 none
menu color help		* #ff90939b #00000000 none
menu vshift 13
menu rows 10
