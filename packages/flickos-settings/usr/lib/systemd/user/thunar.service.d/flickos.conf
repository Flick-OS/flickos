# Thunar started by D-Bus (another program's "Show in Folder", through
# org.freedesktop.FileManager1) runs as this systemd user service, which
# doesn't have the session's XDG_CONFIG_DIRS. Without them it reads Debian's
# /etc/xdg/Thunar/uca.xml in place of FlickOS's /etc/xdg/flickos/Thunar/uca.xml,
# and since Debian's actions have no unique-id it saves a copy of them in
# ~/.config/Thunar/uca.xml, which then hides FlickOS's actions (Send to Phone)
# for good. The same folders as flickos-session's, without the per-login ones.
[Service]
Environment=XDG_CONFIG_DIRS=/etc/xdg/flickos:/etc/xdg
Environment=XDG_DATA_DIRS=/usr/share/flickos:/usr/local/share:/usr/share
