# FlickOS: ask rtkit for real-time priority directly, not through the portal.
#
# PipeWire prefers xdg-desktop-portal's Realtime interface when the portal is
# running. The portal in Debian 13 (1.20) refuses every request ("Could not get
# pidns"), PipeWire logs success anyway, and sound runs without real-time
# priority. Remove this when the Debian release has the fix (upstream
# xdg-desktop-portal pull request 1713).
#
# Linked into each program's conf.d folder (debian/links). WirePlumber doesn't
# read this section, and needs no real-time priority: it carries no sound.
module.rt.args = { rtportal.enabled = false }
