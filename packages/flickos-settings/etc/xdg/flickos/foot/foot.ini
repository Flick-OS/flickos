# FlickOS defaults for foot (Arc-Dark). Full option list: man foot.ini, or
# Debian's commented example at /etc/xdg/foot/foot.ini. ~/.config/foot/foot.ini wins.
# Styles (flickos-layouts) include this file, then their own [colors]
# (/usr/share/flickos/styles/ID/foot.ini): a color key added here must be added
# there too (tools/check-palette.py checks it).
[main]
font=monospace:size=11
pad=8x8

# Arc has no terminal colors. These use colors from arc-theme's Arc-Dark
# stylesheet wherever one exists; magenta and bright green are FlickOS
# additions (see tools/check-palette.py).
[colors]
# 0.0 transparent - 1.0 opaque. The wallpaper shows through; labwc has no blur.
alpha=0.9
background=383c4a
foreground=d3dae3
# black: borders, red: error, green: success, yellow: warning, blue: accent
regular0=2b2e39
regular1=fc4138
regular2=73d216
regular3=f27835
regular4=5294e2
regular5=d68ecb
regular6=4dadd4
regular7=d3dae3
bright0=90939b
bright1=f4797e
bright2=8ae234
bright3=f08437
bright4=a9caf1
bright5=dcb0e8
bright6=76c0de
bright7=ffffff
