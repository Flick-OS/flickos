# FlickOS defaults for fuzzel (Arc-Dark). Reference: man fuzzel.ini.
# ~/.config/fuzzel/fuzzel.ini wins. Colors are RRGGBBAA.
# Styles (flickos-layouts) include this file, then their own colors and
# icon-theme (/usr/share/flickos/styles/ID/fuzzel.ini): a color key added here
# must be added there too (tools/check-palette.py checks it).
[main]
font=sans:size=12
terminal=xdg-terminal-exec
icon-theme=Numix-Circle
prompt="> "
width=40
lines=12
# Close when another window gets the keyboard (a click on it), not only on
# Esc. labwc's desktop clicks (rc.xml) close it too.
keyboard-focus=on-demand

[colors]
background=383c4aee
text=d3dae3ff
prompt=5294e2ff
input=d3dae3ff
match=5294e2ff
selection=5294e2ff
selection-text=ffffffff
selection-match=ffffffff
border=2b2e39ff

[border]
width=2
radius=8
