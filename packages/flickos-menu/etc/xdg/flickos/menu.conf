# The FlickOS start menu's defaults (flickos-menu). The start menu is off
# until a user turns it on in Settings > Desktop Layout & Style.
#
# Pinned: desktop ids, separated by ";", in the order they are shown. Apps
# that aren't installed are left out. A user who pins or unpins an app gets
# their own list in ~/.config/flickos/menu, which then replaces this one.
# The live session uses /etc/xdg/flickos-live/flickos/menu.conf (flickos-installer).
[Menu]
Pinned=firefox-esr.desktop;thunar.desktop;foot.desktop;libreoffice-writer.desktop;vlc.desktop;org.xfce.mousepad.desktop
