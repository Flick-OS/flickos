# System-wide tiling defaults (flick-tiler). A user's choices are in
# ~/.config/flickos/tiler, written by the panel button and the keybinds.
# List the arrangements with: flick-tiler modes
[Tiler]
# Tile new windows. Super+T or the panel button turns it on for a user.
Enabled=no
Mode=master-stack
# Width of the main window in percent (20-80).
MasterRatio=55
# Pixels between windows and the screen edges.
Gap=8
# App ids (shell patterns) that always float. Dialogs of any app float too.
Float=org.pulseaudio.pavucontrol pavucontrol nm-connection-editor lxtask
      calamares io.calamares.calamares flickos-layout waypaper
      polkit-mate-authentication-agent-1 blueman-*
