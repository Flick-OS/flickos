# Seven: FlickOS's own light style with see-through blue title bars and
# panel (flickos-style-seven; tools/make-seven.py writes this folder). It
# uses arc-theme's Arc and the Numix icons, which every FlickOS system has.
[Style]
Name=Seven
Comment=Light windows, see-through blue title bars and panel
Order=30
GtkTheme=Arc
IconTheme=Numix
LabwcTheme=Seven
ColorScheme=prefer-light
Waybar=waybar-colors.css
Foot=foot.ini
Fuzzel=fuzzel.ini
Mako=mako.conf
Wallpaper=wallpaper.png
