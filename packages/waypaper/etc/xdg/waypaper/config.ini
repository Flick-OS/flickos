# FlickOS defaults for waypaper (the Wallpaper app). A user's
# ~/.config/waypaper/config.ini wins; waypaper writes it when a wallpaper is
# chosen. Don't set wallpaper = here: a chosen wallpaper replaces the desktop
# layout's (flickos-layout wallpaper).
[Settings]
folder = /usr/share/backgrounds/flickos
         ~/Pictures
backend = swaybg
fill = fill
# Arc-Dark bg_color, around images that don't fill the screen.
color = #383c4a
