# Eleven: FlickOS's own dark style with dark grey title bars and a
# see-through dark panel (flickos-style-eleven; tools/make-eleven.py writes
# this folder). It uses GTK's Adwaita-dark and the Adwaita icons, which the
# package depends on. The package's layout eleven goes with it.
[Style]
Name=Eleven
Comment=Dark grey windows and panel, blue folds of light
Order=80
GtkTheme=Adwaita-dark
IconTheme=Adwaita
LabwcTheme=Eleven
ColorScheme=prefer-dark
Waybar=waybar-colors.css
Foot=foot.ini
Fuzzel=fuzzel.ini
Mako=mako.conf
Wallpaper=wallpaper.png
