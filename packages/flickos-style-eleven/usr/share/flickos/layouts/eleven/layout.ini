# Eleven: one dark see-through panel at the bottom with the apps button and
# the window list in the middle, the status and a two-line clock at the right
# (flickos-style-eleven; ricing ADR-019). The start menu opens above the
# middle of the panel (Menu=bottom-center). The window buttons stay labwc's
# own order: the window's icon on the left, minimize, maximize and close on
# the right. Keys: see ../redmond/layout.ini.
[Layout]
Name=Eleven
Comment=One dark panel at the bottom with the apps button and the windows in the middle
Order=80
Waybar=waybar.jsonc
Style=style.css
Preview=preview.png
Menu=bottom-center
MenuStyle=classic
Quick=bottom-right
