    <path d="M-100 760C700 540 1260 820 2020 400L2020 470C1300 860 720 600 -100 810Z" fill="#a6dcff" opacity="0.25" filter="url(#glow)"/>
    <path d="M-100 760C700 540 1260 820 2020 400L2020 470C1300 860 720 600 -100 810Z" fill="url(#fold3)" opacity="0.5"/>
