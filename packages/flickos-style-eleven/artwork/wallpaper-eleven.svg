    <path d="M-100 860C520 600 1060 980 2020 520" fill="none" stroke="#d6efff" stroke-opacity="0.55" stroke-width="3" filter="url(#soft)"/>
    <path d="M-100 800C600 560 1200 900 2020 440L2020 560C1200 960 620 660 -100 880Z" fill="#63b6f6" opacity="0.30" filter="url(#glow)"/>
