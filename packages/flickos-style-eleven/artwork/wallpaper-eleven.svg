<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Eleven's wallpaper (tools/make-eleven.py): FlickOS's halo, as on
       Dark's, above folds of blue light on a deep blue. -->
  <defs>
    <radialGradient id="depth" cx="0.45" cy="0.75" r="0.85">
      <stop offset="0" stop-color="#0c3580"/>
      <stop offset="0.55" stop-color="#071d4f"/>
      <stop offset="1" stop-color="#030b24"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2520" height="1800">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2520" height="1800">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="fold0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2f7a"/>
      <stop offset="0.55" stop-color="#1f6fd6"/>
      <stop offset="1" stop-color="#0b3a8f"/>
    </linearGradient>
    <linearGradient id="fold1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d3f9e"/>
      <stop offset="0.55" stop-color="#3a93ec"/>
      <stop offset="1" stop-color="#1352b5"/>
    </linearGradient>
    <linearGradient id="fold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1453b8"/>
      <stop offset="0.55" stop-color="#63b6f6"/>
      <stop offset="1" stop-color="#1d68cc"/>
    </linearGradient>
    <linearGradient id="fold3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a75d8"/>
      <stop offset="0.55" stop-color="#a6dcff"/>
      <stop offset="1" stop-color="#3a8be4"/>
    </linearGradient>
    <linearGradient id="tail" x1="1235" y1="625" x2="1600" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
