# Experience: FlickOS's own bright style with deep blue title bars and a
# blue panel (flickos-style-experience; tools/make-experience.py writes this
# folder). It uses Debian's Greybird and the Tango icons, which the package
# depends on. The package's layout experience goes with it.
[Style]
Name=Experience
Comment=Blue title bars and panel, a green hill under a blue sky
Order=70
GtkTheme=Greybird
IconTheme=Tango
LabwcTheme=Experience
ColorScheme=prefer-light
Waybar=waybar-colors.css
Foot=foot.ini
Fuzzel=fuzzel.ini
Mako=mako.conf
Wallpaper=wallpaper.png
