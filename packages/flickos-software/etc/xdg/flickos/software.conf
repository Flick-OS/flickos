# Software (flickos-software). These are the system's defaults; each user's
# own choice is in ~/.config/flickos/software and wins.
# flickos-software paid set on|off|default
[Software]
# on: apps with a price (FlickOS's own apps once they are sold, and other
# developers' paid apps) show in the search, the categories and the
# shelves, with their price and Buy…. off: they show only once installed.
# The prices come from the list FlickOS publishes (featured.json); nothing
# about the user is sent for them.
Paid=on
