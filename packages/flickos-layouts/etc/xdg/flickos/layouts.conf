# System-wide default desktop layout, style, desktop clicks, apps button,
# start menu style, clock and Quick Settings, used by users who haven't chosen one
# (~/.config/flickos/layout, style, clicks, launcher, menu-style, clock,
# quick-settings).
# List them with: flickos-layout list, flickos-layout style list,
# flickos-layout clicks list, flickos-layout launcher list,
# flickos-layout menu-style list, flickos-layout clock list,
# flickos-layout quick-settings list
# Launcher=fuzzel makes the app launcher the default apps button instead of
# the start menu (flickos-menu).
# MenuStyle=layout uses each layout's own style (MenuStyle= in its layout.ini);
# classic, categories or grid uses that one for every layout.
# Clock=12h shows the panel clock with AM/PM.
# QuickSettings=on turns on Quick Settings (flickos-menu): the panel's volume
# and battery icons and Super+A open switches for Wi-Fi, Do Not Disturb,
# night light and more, and sliders for volume and brightness.
# A different Style= doesn't change the GTK theme of new users: that default
# is in flickos-settings' 90_flickos-settings.gschema.override.
[Defaults]
Layout=redmond
Style=dark
Clicks=right-menu
Launcher=menu
MenuStyle=layout
Clock=24h
QuickSettings=off
