# Redmond+: Redmond's panel drawn by sfwbar instead of waybar, with one
# taskbar button per app (its windows listed on hover), a right-click window
# menu, and a more button for the apps that don't fit
# (docs/design/flickos-panel.md). The whole panel is the Dock= bar, which
# follows the panel's settings through the dock's "#if" lines; waybar runs
# with a bar for a screen that doesn't exist (waybar.jsonc), so
# flickos-layout's supervision, set and reload-panel work unchanged.
# Keys: see ../redmond/layout.ini.
[Layout]
Name=Redmond+
Comment=Redmond with one taskbar button per app, its windows listed on hover
Order=11
Waybar=waybar.jsonc
Style=style.css
Preview=preview.png
Menu=bottom-left
MenuStyle=prompt
MenuArrow=23 32
Quick=bottom-right
Dock=panel.config
# No Pinned=: no app is pinned until the user pins one (the taskbar's
# right-click menu, Settings' Pinned Apps).
DockStyle=panel.css
# The floating panel is drawn by panel.css (grid#panel.floating); these only
# make flickos-layout keep panel-state.css, which flick-tiler writes and
# panel.config reads. They style the empty waybar, so they are empty too.
Floating=floating.css
FloatingFull=floating-full.css
