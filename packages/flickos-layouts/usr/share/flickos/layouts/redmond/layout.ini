# Keys: Name, Comment, Order (sort key), Waybar and Style (paths, relative to
# this folder or absolute), TitlebarLayout (optional, labwc
# <theme><titlebar><layout>, e.g. "close,iconify,max:"), Pinned (optional,
# desktop file ids separated by ";", shown where the bar has "flickos/pinned"
# and in the dock's `pins = "flickos/pinned"`), Dock and DockStyle (optional, a
# bar run by sfwbar next to waybar: its config and CSS, e.g. Cupertino's dock
# ../cupertino/dock.config, Traditional's window list; its
# `Exec("flickos/launcher")` runs what the apps button runs), Desktops (optional,
# 1 to 9, default 1: labwc desktops, switched with Super+Ctrl+Left/Right;
# a switcher is sfwbar's pager),
# Preview (optional, image for the chooser, 240x150: tools/make-layout-previews.sh),
# Wallpaper (optional, shown unless the user chose their own; FlickOS's
# layouts have none and show the style's),
# Menu (optional, bottom-left or top-left: the corner of the start menu, where
# the bar's apps button is; the start menu is off unless the user turns it on
# with flickos-layout launcher set menu), MenuStyle (optional, the kind of
# start menu: classic (default, Windows 7), categories (GNOME 2/Whisker) or
# grid (full-screen app icons, Launchpad)), Quick (optional, bottom-right or
# top-right: the corner of Quick Settings, where the bar's volume and battery
# icons are; used only while the user turns it on with flickos-layout
# quick-settings set on).
[Layout]
Name=Redmond
Comment=One panel at the bottom: apps menu, window list, status icons and clock
Order=10
Waybar=waybar.jsonc
Style=style.css
Preview=preview.png
Menu=bottom-left
MenuStyle=classic
Quick=bottom-right
