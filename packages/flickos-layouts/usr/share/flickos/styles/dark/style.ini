# A style recolors the desktop: GTK theme, icons, labwc window theme, and the
# palettes of FlickOS's panel, terminal, launcher and notifications.
# Keys: Name, Comment, Order (sort key), GtkTheme, IconTheme, LabwcTheme
# (theme names), ColorScheme (org.gnome.desktop.interface color-scheme:
# default, prefer-dark or prefer-light), Waybar, Foot, Fuzzel, Mako (palette
# files, relative to this folder or absolute), Wallpaper (optional, shown
# unless the user chose their own or the layout has one; also linked into
# /usr/share/backgrounds/flickos/ by debian/links for waypaper). The palette
# files of every style must set the same keys (tests/test_styles.py).
[Style]
Name=Dark
Comment=Dark windows and panels (Arc-Dark)
Order=10
GtkTheme=Arc-Dark
IconTheme=Numix-Circle
LabwcTheme=FlickOS-Arc-Dark
ColorScheme=prefer-dark
Waybar=waybar-colors.css
Foot=foot.ini
Fuzzel=fuzzel.ini
Mako=mako.conf
Wallpaper=wallpaper.png
