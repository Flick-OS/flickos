# FlickOS Light style: foot colors (Arc), included after
# /etc/xdg/flickos/foot/foot.ini. tools/check-palette.py verifies the values.
[colors]
alpha=0.9
background=f5f6f7
foreground=5c616c
# Arc's accent, error, warning and success colors, darkened until they are
# readable on the light background (regular: 4.5:1, bright: 3:1).
regular0=383c4a
regular1=cb0c03
regular2=40760c
regular3=b5480c
regular4=1e61b0
regular5=a83d97
regular6=247697
regular7=dcdfe3
bright0=696d75
bright1=fc4138
bright2=4d8d0f
bright3=cd510d
bright4=2679db
bright5=c256b1
bright6=2986ab
bright7=ffffff
