# Tortuga: FlickOS's own dark style with slate panels and a lantern copper
# accent (flickos-style-tortuga; tools/make-tortuga.py writes this folder). It
# uses GTK's Arc-Dark and the Numix-Circle icons, which the package depends
# on. The package's layout tortuga goes with it.
[Style]
Name=Tortuga
Comment=Slate panels, lantern light, a harbour at dusk
Order=90
GtkTheme=Arc-Dark
IconTheme=Numix-Circle
LabwcTheme=Tortuga
ColorScheme=prefer-dark
Waybar=waybar-colors.css
Foot=foot.ini
Fuzzel=fuzzel.ini
Mako=mako.conf
Wallpaper=wallpaper.png
