# Tortuga: three floating islands at the top (the apps button, the clock, the
# status) and a dock at the bottom with the desktops as a 2x2 grid beside it
# (flickos-style-tortuga; ricing ADR-020). While a window fills the screen the
# islands join into one full panel and the dock hides. Keys: see
# ../redmond/layout.ini.
[Layout]
Name=Tortuga
Comment=Floating islands at the top, and a dock with the desktops as a 2x2 grid
Order=90
Waybar=waybar.jsonc
Style=style.css
Preview=preview.png
Menu=top-left
MenuStyle=grid
Quick=top-right
Dock=dock.config
DockStyle=dock.css
Desktops=4
Floating=floating.css
FloatingFull=floating-full.css
FloatingDefault=on
Pinned=firefox-esr.desktop;thunar.desktop;foot.desktop;libreoffice-writer.desktop;vlc.desktop;org.xfce.mousepad.desktop
