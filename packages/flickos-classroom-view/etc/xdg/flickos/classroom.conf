# Sharing this screen with a teacher (flickos-classroom-view). These are the
# system's defaults; each user's own choice is in ~/.config/flickos/classroom
# and wins.
# flickos-classroom-view student on|off
[Classroom]
# on: a teacher's computer paired with this one (Settings > Classroom > Pair
# With a Teacher) can see this screen while both are on the same network,
# lock it during a class, show a message or open a web page. The panel shows
# when the screen can be seen. Off by default: nothing of it runs.
Sharing=off
