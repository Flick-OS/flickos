# FlickOS's boot menu (flickos-branding). Read by update-grub after
# /etc/default/grub. For your own theme, change these lines or set them again
# in a file that sorts after this one, then run: sudo update-grub
#
# GRUB_THEME gives the full look. GRUB_BACKGROUND is the fallback: when GRUB
# can't read /usr (a separate /boot with an encrypted system), update-grub
# copies the picture into /boot/grub and the menu keeps it, in GRUB's own
# text colors. Only while the theme is installed: a removed flickos-branding
# leaves this file behind, and a GRUB_BACKGROUND that doesn't exist stops
# update-grub from looking for any other picture (one put in /boot/grub).
if [ -e /usr/share/flickos/grub/theme.txt ]; then
    GRUB_THEME=/usr/share/flickos/grub/theme.txt
    GRUB_BACKGROUND=/usr/share/flickos/grub/background.png
fi
