---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    # GB. Also decides swap: Calamares makes a swap partition only when the
    # disk has more room than this + 600 MiB + the swap size (partition.conf),
    # and otherwise drops it silently. A btrfs install uses 2 GiB, ext4 3.3 GB
    # (docs/design/flickos-recovery.md, phase 1a).
    requiredStorage:    10
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
