# Partitioning (docs/design/flickos-recovery.md, phase 1a and phase 1). Without this file
# Calamares offered only hibernation-sized swap, with no choice shown, and no
# filesystem choice when erasing a disk. The keys not listed keep Calamares'
# defaults.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB

# A swap partition, never a swap file: hibernation (resume=) with a btrfs swap
# file needs its offset worked out (ADR-001). Calamares 3.3 makes the partition
# only when the disk has more room than welcome.conf's requiredStorage +
# 600 MiB + the swap size, and otherwise drops it silently. With Hibernate
# (today's default) the swap is twice the memory up to 4 GB of memory, 8 GiB up
# to 8 GB, the memory above; without, the same but at most 8 GiB and at most a
# tenth of the disk, so a small disk can still get one. Every install also has
# zram (zram-tools).
userSwapChoices:
    - none
    - small
    - suspend
initialSwapChoice: suspend

luksGeneration: luks1

initialPartitioningChoice: none

# btrfs by default: with mount.conf's layout, the system gets restore points
# (flickos-recovery, ADR-001). ext4 is still offered.
defaultFileSystemType:  "btrfs"
availableFileSystemTypes:  ["btrfs", "ext4"]
