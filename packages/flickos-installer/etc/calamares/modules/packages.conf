backend: apt

operations:
  - remove:
      # Live-session-only packages; see config/package-lists/live.list.chroot
      # and installer.list.chroot. List only packages that are in the image:
      # the image has no apt indices, so offline apt-get fails with "Unable
      # to locate package" for any other name (Debian's list also has
      # live-boot-doc, live-config-doc and live-task-*).
      - 'live-boot'
      - 'live-config'
      - 'live-config-systemd'
      - 'live-tools'
      - 'flickos-installer'
      - 'calamares'
