# The weather in the panel (flickos-weather). These are the system's
# defaults; each user's own choices are in ~/.config/flickos/weather and win.
# flickos-weather set enabled on|off|default
# flickos-weather set units auto|celsius|fahrenheit|default
# flickos-weather set wind auto|kmh|ms|mph|kn|default
# flickos-weather set place LATITUDE,LONGITUDE,NAME|default   (flickos-weather find TEXT)
[Weather]
# on: the temperature and the sky in the panel, the next hours and days in
# its tooltip. While on, the computer asks the weather service (below) once
# an hour for the forecast at Place, sending only its position rounded to
# about 1 km (PRIVACY.md). Off by default: nothing of it runs or is sent.
Enabled=off
# auto: Fahrenheit where the region measures so (en_US and a few others),
# else Celsius.
Units=auto
# The wind's unit: kmh, ms (metres per second, as in Finland), mph or kn
# (knots). auto: mph with Fahrenheit, else km/h.
Wind=auto
# Where: LATITUDE,LONGITUDE,NAME. Empty: the user picks one in Settings.
Place=

# The weather service: Open-Meteo by default, whose free service is for
# non-commercial use. An organization points these at its own Open-Meteo
# (it is open source) or its paid service's addresses. Only this file is
# read for them, never a user's.
[Server]
ForecastUrl=https://api.open-meteo.com/v1/forecast
SearchUrl=https://geocoding-api.open-meteo.com/v1/search
