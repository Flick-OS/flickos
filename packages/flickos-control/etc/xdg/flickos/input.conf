# System-wide mouse and touchpad defaults for the Settings window
# (flickos-control). A user's choices are in ~/.config/flickos/input and win.
# Set with: flickos-control set KEY VALUE; list with: flickos-control get
# Unset options keep labwc's and libinput's defaults.

#[Touchpad]
#Tap=yes
#NaturalScroll=no
#DisableWhileTyping=yes
# -1.0 (slow) to 1.0 (fast)
#PointerSpeed=0.00
# buttonAreas or clickfinger
#ClickMethod=buttonAreas

#[Mouse]
#LeftHanded=no
#NaturalScroll=no
#PointerSpeed=0.00
# adaptive or flat
#AccelProfile=adaptive
