# System-wide keyboard defaults for the Settings window (flickos-control).
# A user's choices are in ~/.config/flickos/keyboard and win.
# The system keyboard layout is /etc/default/keyboard (keyboard(5)), not here.

#[Keyboard]
# Milliseconds before a held key repeats (150-1000), repeats per second (10-60)
#RepeatDelay=600
#RepeatRate=25
#Numlock=no
