# System-wide screen zoom defaults for the Settings window (flickos-control,
# Accessibility). A user's choices are in ~/.config/flickos/zoom and win.
# Set with: flickos-control set KEY VALUE; list with: flickos-control get
# Unset options keep flickos-settings' labwc rc.xml (<magnifier>).

#[Zoom]
# screen (the whole screen) or lens (a square around the pointer)
#Area=screen
# The lens's width and height in pixels, 200 to 800
#LensSize=400
# How much each Super+= or Super+- zooms, 0.25 to 1
#Step=0.50
#Smooth=yes
