# System-wide night light defaults for the Settings window (flickos-control).
# A user's choices are in ~/.config/flickos/night-light and win. Night light
# makes the screen warmer from sunset to sunrise, timed for the time zone.
# Temperature: the night color in Kelvin, 2500 (warmest) to 6000.

#[Night-Light]
#Enabled=yes
#Temperature=4000
