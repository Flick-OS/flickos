# Media controls (flickos-media). These are the system's defaults; each
# user's own choices are in ~/.config/flickos/media and win.
# flickos-media set controls on|off|default
# flickos-media set spectrum on|off|default
# flickos-media set spectrum-layer behind|top|default
# flickos-media set spectrum-shape strip|radial|default
# flickos-media set spectrum-colors style|rainbow|default
[Media]
# on: previous, play or pause, next and what is playing in the panel, while
# an app plays something. Off by default: nothing of it runs while off.
Controls=off
# on: a sound spectrum just above the panel while something plays (with the
# controls on). About 6 % of one processor thread on an older laptop while
# it shows; nothing while nothing plays. The panel's spectrum button turns
# it on and off.
Spectrum=off
# behind: under windows, over the wallpaper. top: over windows too (a
# fullscreen window still covers it); clicks go through it either way.
SpectrumLayer=behind
# strip: bars just above the panel. radial: bars around a ring in the middle
# of the screen, always behind windows (SpectrumLayer is for the strip).
SpectrumShape=strip
# style: the style's selection color. rainbow: every color, round the ring
# from cyan at the top to red at the bottom (along the strip from the left),
# with a white ring; it doesn't follow the style.
SpectrumColors=style
