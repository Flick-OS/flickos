# Screenshots and screen recordings (flickos-screenshot). These are the
# system's defaults; each user's own choices are in ~/.config/flickos/screenshot
# and win.
# flickos-screenshot set folder|recordings-folder PATH|default
# flickos-screenshot set pointer yes|no|default
# flickos-screenshot set sound none|computer|microphone|both|default
[Screenshot]
# Where screenshots are saved. Empty: Pictures/Screenshots
# (xdg-user-dir PICTURES).
#Folder=
# Where recordings are saved. Empty: Videos/Screen Recordings
# (xdg-user-dir VIDEOS).
#RecordingsFolder=
# yes: screenshots include the mouse pointer (grim -c).
Pointer=no
# A recording's sound: none, computer (what is playing), microphone, both.
Sound=none
