# Footprint: FlickOS's own dark style with a black top bar, grey windows
# with centered titles and round buttons (flickos-style-footprint;
# tools/make-footprint.py writes this folder). It uses GTK's Adwaita-dark,
# the Adwaita icons and the Cantarell font, which the package depends on.
# The package's layout footprint goes with it.
[Style]
Name=Footprint
Comment=Black top bar, grey windows with round buttons
Order=50
GtkTheme=Adwaita-dark
IconTheme=Adwaita
LabwcTheme=Footprint
ColorScheme=prefer-dark
Waybar=waybar-colors.css
Foot=foot.ini
Fuzzel=fuzzel.ini
Mako=mako.conf
Wallpaper=wallpaper.png
