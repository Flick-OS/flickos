# Footprint's layout (flickos-style-footprint, ADR-016 of
# docs/design/flickos-ricing.md): a black top bar with the desktops as dots
# on the left, the clock in the middle and the status on the right, and a
# dock on the left edge, whose Show Apps is the apps button, for the
# Footprint style. Software's Use sets both;
# in Settings it is one of the layouts. Keys: see flickos-layouts'
# layouts/redmond/layout.ini.
[Layout]
Name=Footprint
Comment=Top bar with the clock in the middle, a dock on the left
Order=50
Waybar=waybar.jsonc
Style=style.css
Preview=preview.png
Menu=top-left
MenuStyle=grid
Quick=top-right
TitlebarLayout=:iconify,max,close
Desktops=4
Dock=dock.config
DockStyle=dock.css
Pinned=firefox-esr.desktop;thunar.desktop;foot.desktop;libreoffice-writer.desktop;flickos-software.desktop
