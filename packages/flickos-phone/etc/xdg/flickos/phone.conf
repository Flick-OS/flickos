# The phone connection (flickos-phone): send pages, files and text between
# a phone with the KDE Connect app and this computer. These are the system's
# defaults; each user's own choices are in ~/.config/flickos/phone and win.
# flickos-phone set enabled yes|no|default, flickos-phone set name NAME|default.
[Phone]
# yes: on for every account that hasn't turned it off. Off by default: it's
# the only FlickOS program that listens on the network.
Enabled=no
# The name phones see. Empty: the computer's name (hostnamectl --pretty).
#Name=
# The phone's notifications on this computer. Off until turned on: they put
# the phone's messages on the screen. Which apps may show is NotificationApps
# in the user's file (a JSON list of names); none are allowed until then.
# Nothing is shown while the screen is locked.
# flickos-phone set notifications yes|no|default
# flickos-phone notifications list|allow NAME|block NAME
#Notifications=no
# Calls. Off until turned on: a ringing phone names the caller here, and
# what is playing pauses until the call ends. Nothing is shown while the
# screen is locked.
# flickos-phone set calls yes|no|default
#Calls=no
# What's playing on this computer, in the phone's app: play, pause, skip,
# the volume, the name and the picture. Off until turned on. Nothing
# changes while the screen is locked.
# flickos-phone set media yes|no|default
#Media=no
# Named commands the phone may run. Empty until one is added, and not
# announced to the phone until then. The phone is sent the names and asks
# by key; the command line stays on this computer. A command runs as the
# user. Nothing runs while the screen is locked.
# flickos-phone commands list
# flickos-phone commands add NAME COMMAND
# flickos-phone commands remove KEY
# flickos-phone set commands default
#Commands=
