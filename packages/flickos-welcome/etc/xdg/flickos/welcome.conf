# The welcome window a new account sees once, at its first login
# (flickos-welcome). It never opens in the live session.
#
# Enabled=no turns it off for everyone on this machine: no window at a first
# login, and the menu entry does nothing useful. A fleet or a FlickOS variant
# that does its own introduction sets this.
[Welcome]
Enabled=yes

# Addresses the cards open in the browser. A card whose address is empty is
# left out of the window, so emptying Donate= removes that card. Never point
# one of these at an address FlickOS doesn't control; Donate= must stay the
# same address as donateUrl in the installer's branding.desc.
[Links]
Project=https://github.com/dvbondoy/FlickOS
Docs=https://github.com/dvbondoy/FlickOS/tree/main/docs
Issues=https://github.com/dvbondoy/FlickOS/issues
Donate=https://flickos.vercel.app/donate
