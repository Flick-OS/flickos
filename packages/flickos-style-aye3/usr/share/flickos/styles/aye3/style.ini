# Aye3: FlickOS's own dark style with a black panel, flat slate blue title
# bars and thin borders (flickos-style-aye3; tools/make-aye3.py writes this
# folder). It uses arc-theme's Arc-Dark and the Numix icons, which every
# FlickOS system has. The package's layout aye3 goes with it.
[Style]
Name=Aye3wm
Comment=Black panel, flat slate blue title bars, thin borders
Order=40
GtkTheme=Arc-Dark
IconTheme=Numix
LabwcTheme=Aye3
ColorScheme=prefer-dark
Waybar=waybar-colors.css
Foot=foot.ini
Fuzzel=fuzzel.ini
Mako=mako.conf
Wallpaper=wallpaper.png
