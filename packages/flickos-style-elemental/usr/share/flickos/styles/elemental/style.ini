# Elemental: FlickOS's own light style with a see-through dark top bar,
# light grey windows with centered titles (flickos-style-elemental;
# tools/make-elemental.py writes this folder). It uses GTK's Adwaita and the
# elementary icons, which the package depends on. The package's layout
# elemental goes with it.
[Style]
Name=Elemental
Comment=Light windows, a see-through dark top bar
Order=60
GtkTheme=Adwaita
IconTheme=elementary
LabwcTheme=Elemental
ColorScheme=prefer-light
Waybar=waybar-colors.css
Foot=foot.ini
Fuzzel=fuzzel.ini
Mako=mako.conf
Wallpaper=wallpaper.png
