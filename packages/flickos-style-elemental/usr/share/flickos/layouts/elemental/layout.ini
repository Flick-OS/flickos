# Elemental: a see-through top bar with "Applications" and a light dock at the
# bottom, close on the left and maximize on the right of the title bar
# (flickos-style-elemental; ricing ADR-017). The dock's behavior is
# Cupertino's own dock.config from flickos-layouts, so its fixes reach this
# layout too; the bar, its CSS and the dock's look are this package's.
# Keys: see ../redmond/layout.ini.
[Layout]
Name=Elemental
Comment=Top bar with Applications, a light dock; close on the left, maximize on the right
Order=60
Waybar=waybar.jsonc
Style=style.css
Preview=preview.png
Menu=top-left
MenuStyle=grid
Quick=top-right
TitlebarLayout=close:max
Dock=../cupertino/dock.config
DockStyle=dock.css
Pinned=firefox-esr.desktop;thunar.desktop;foot.desktop;libreoffice-writer.desktop;vlc.desktop;org.xfce.mousepad.desktop
