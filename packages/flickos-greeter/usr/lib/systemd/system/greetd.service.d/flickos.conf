# FlickOS login screen (flickos-greeter). The configuration is generated at
# every start by greetd-config, so greetd's own /etc/greetd/config.toml is
# left alone and ignored.
[Unit]
# The live session logs in automatically on tty1 (live-config).
ConditionKernelCommandLine=!boot=live

[Service]
ExecStartPre=/usr/libexec/flickos/greetd-config
ExecStart=
ExecStart=greetd --config /run/flickos-greetd/config.toml
