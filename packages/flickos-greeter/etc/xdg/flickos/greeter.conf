# The login screen's defaults (flickos-greeter). Settings > Login Screen, or
# flickos-control system login-background / login-position, writes the
# computer's own choice to /etc/flickos/greeter, which wins over this file.
# A custom build (docs/10) can set its own defaults here.

# The background picture: a PNG or JPEG every user can read. Empty: the Dark
# style's wallpaper.
#Background=

# Where the login box sits on its screen: left, center or right.
#Position=center
